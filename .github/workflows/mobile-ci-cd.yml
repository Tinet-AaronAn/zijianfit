name: Mobile CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'

jobs:
  build-apk:
    name: 📱 构建 APK
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: ./mobile
        run: pnpm install --frozen-lockfile

      - name: Generate version name
        id: version
        run: |
          VERSION_NAME="1.0.${{ github.run_number }}"
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Version: $VERSION_NAME"

      - name: Build APK (Debug)
        working-directory: ./mobile/android
        run: |
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/zijianfit-${{ steps.version.outputs.version_name }}-debug.apk

      - name: Build APK (Release)
        working-directory: ./mobile/android
        run: |
          ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/zijianfit-${{ steps.version.outputs.version_name }}-release.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zijianfit-debug-${{ steps.version.outputs.version_name }}
          path: mobile/android/app/build/outputs/apk/debug/zijianfit-${{ steps.version.outputs.version_name }}-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: zijianfit-release-${{ steps.version.outputs.version_name }}
          path: mobile/android/app/build/outputs/apk/release/zijianfit-${{ steps.version.outputs.version_name }}-release.apk

  create-release:
    name: 📦 创建 Release
    needs: build-apk
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate version name
        id: version
        run: |
          VERSION_NAME="1.0.${{ github.run_number }}"
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: zijianfit-debug-${{ steps.version.outputs.version_name }}
          path: ./apk-debug

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: zijianfit-release-${{ steps.version.outputs.version_name }}
          path: ./apk-release

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: ZijianFit v${{ steps.version.outputs.version_name }}
          body: |
            ## 🏋️ ZijianFit v${{ steps.version.outputs.version_name }}

            ### 📥 下载
            - **Debug 版本**: zijianfit-${{ steps.version.outputs.version_name }}-debug.apk
            - **Release 版本**: zijianfit-${{ steps.version.outputs.version_name }}-release.apk

            ### 📝 更新内容
            ${{ github.event.head_commit.message }}

            ### 🔗 相关信息
            - 提交: ${{ github.sha }}
            - 分支: ${{ github.ref }}
            - 时间: ${{ github.event.head_commit.timestamp }}

            ---
            🦞 随行 CI/CD
          files: |
            ./apk-debug/*.apk
            ./apk-release/*.apk
          draft: false
          prerelease: false
